services:
  mysql:
    image: mysql:8.4
    container_name: fcfs-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fcfs
      MYSQL_USER: fcfs
      MYSQL_PASSWORD: fcfs1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufcfs", "-pfcfs1234"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fcfs-redis
    # AOF 로 재시작해도 접수 명단을 보존한다. 접수 명단은 원본 데이터라 메모리가 차도 지우지 않는다(noeviction).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    container_name: fcfs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft: ZooKeeper 없이 브로커 하나가 컨트롤러도 맡는다
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1         # 브로커가 1대라 내부 토픽 복제본도 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"          # 토픽은 coupon-api 가 파티션 수를 정해서 만든다
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
  mysql-data:
  redis-data:
