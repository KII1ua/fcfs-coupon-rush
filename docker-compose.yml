services:
  mysql:
    image: mysql:8.4
    container_name: fcfs-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fcfs
      MYSQL_USER: fcfs
      MYSQL_PASSWORD: fcfs1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufcfs", "-pfcfs1234"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fcfs-redis
    # AOF 로 재시작해도 접수 명단을 보존한다. 접수 명단은 원본 데이터라 메모리가 차도 지우지 않는다(noeviction).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
