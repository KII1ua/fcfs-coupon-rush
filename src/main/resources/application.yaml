spring:
  application:
    name: fcfs-coupon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fcfs}
    username: ${DB_USERNAME:fcfs}
    password: ${DB_PASSWORD:fcfs1234}
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 만든다. JPA 는 엔티티와 테이블이 맞는지만 확인
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: 8080
