spring:
  application:
    name: fcfs-coupon
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fcfs}
    username: ${DB_USERNAME:fcfs}
    password: ${DB_PASSWORD:fcfs1234}
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 가 만든다. JPA 는 엔티티와 테이블이 맞는지만 확인
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      lettuce:
        pool:                     # MULTI/EXEC 는 요청마다 전용 커넥션을 잡는다. 풀이 없으면 매번 새 TCP 연결을 맺는다
          enabled: true
          max-active: 64
          max-idle: 64
          min-idle: 16

server:
  port: 8080
