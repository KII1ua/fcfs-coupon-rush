spring:
  application:
    name: coupon-consumer
  main:
    web-application-type: none          # 웹 서버 없이 Kafka 만 듣는다
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fcfs}
    username: ${DB_USERNAME:fcfs}
    password: ${DB_PASSWORD:fcfs1234}
    hikari:
      connection-timeout: 5000          # DB 장애 때 기본 30초씩 붙잡히지 않고 빨리 실패해서 에러 핸들러의 재시도로 넘긴다
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coupon-issue-consumer
